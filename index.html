<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02050c">
  <meta name="color-scheme" content="dark">
  <meta name="version" content="1.0">
  <meta name="description" content="Andy — personal links, social profiles, music and video in one place.">

  <meta property="og:title" content="Andy — Links">
  <meta property="og:description" content="Personal links, social profiles, music and video in one place.">
  <meta property="og:type" content="website">

  <title>Andy — Links</title>

  <style>
    :root {
      --night-0: #01030a;
      --night-1: #020711;
      --night-2: #061322;
      --night-3: #0a2035;
      --text: #edf5fb;
      --muted: #8fa5b7;
      --muted-2: #6f8799;
      --accent: #b2ccdc;
      --line: rgba(159, 193, 216, 0.17);
      --line-strong: rgba(172, 206, 227, 0.34);
      --card: rgba(5, 17, 30, 0.70);
      --card-hover: rgba(9, 29, 49, 0.88);
      --shadow: rgba(0, 0, 0, 0.38);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--night-0);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 15%, rgba(28, 65, 96, 0.27), transparent 30%),
        radial-gradient(circle at 84% 21%, rgba(37, 77, 109, 0.12), transparent 24%),
        linear-gradient(180deg, var(--night-0) 0%, #030914 38%, var(--night-2) 70%, var(--night-1) 100%);
      overflow-x: hidden;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    .scene,
    .scene::before,
    .scene::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .scene {
      z-index: 0;
      overflow: hidden;
    }

    .scene::before {
      content: "";
      background-image:
        radial-gradient(circle at 8% 13%, rgba(255,255,255,.68) 0 1px, transparent 1.45px),
        radial-gradient(circle at 18% 31%, rgba(196,220,236,.34) 0 1px, transparent 1.45px),
        radial-gradient(circle at 27% 8%, rgba(255,255,255,.40) 0 1px, transparent 1.45px),
        radial-gradient(circle at 39% 23%, rgba(255,255,255,.27) 0 1px, transparent 1.45px),
        radial-gradient(circle at 49% 10%, rgba(211,230,242,.52) 0 1px, transparent 1.45px),
        radial-gradient(circle at 61% 34%, rgba(255,255,255,.31) 0 1px, transparent 1.45px),
        radial-gradient(circle at 71% 16%, rgba(255,255,255,.55) 0 1px, transparent 1.45px),
        radial-gradient(circle at 82% 37%, rgba(190,216,234,.32) 0 1px, transparent 1.45px),
        radial-gradient(circle at 92% 11%, rgba(255,255,255,.42) 0 1px, transparent 1.45px),
        radial-gradient(circle at 95% 48%, rgba(255,255,255,.23) 0 1px, transparent 1.45px),
        radial-gradient(circle at 13% 51%, rgba(255,255,255,.20) 0 1px, transparent 1.45px),
        radial-gradient(circle at 54% 45%, rgba(211,230,242,.22) 0 1px, transparent 1.45px);
      opacity: .80;
      animation: stars 9s ease-in-out infinite alternate;
    }

    .scene::after {
      content: "";
      inset: auto -15% 0 -15%;
      height: 22vh;
      min-height: 130px;
      background:
        linear-gradient(180deg, rgba(2, 9, 16, 0) 0%, rgba(4, 22, 36, .54) 24%, rgba(1, 8, 16, .96) 100%);
      border-top: 1px solid rgba(146, 187, 214, .13);
      box-shadow:
        inset 0 12px 28px rgba(100, 154, 190, .025),
        0 -1px 0 rgba(173, 205, 225, .04);
      transform: rotate(-0.25deg);
    }

    .moon {
      position: fixed;
      z-index: 0;
      top: clamp(30px, 6.5vh, 72px);
      right: clamp(24px, 8vw, 130px);
      width: clamp(58px, 7vw, 88px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 31% 30%, rgba(255,255,255,.96) 0 8%, transparent 9%),
        radial-gradient(circle at 64% 63%, rgba(117,139,153,.13) 0 13%, transparent 14%),
        radial-gradient(circle at 38% 70%, rgba(94,120,137,.10) 0 8%, transparent 9%),
        radial-gradient(circle at 36% 31%, #f1f5f7 0%, #d5e0e6 49%, #91a9b9 100%);
      box-shadow:
        0 0 18px rgba(202, 225, 239, .22),
        0 0 62px rgba(89, 144, 181, .15),
        0 0 110px rgba(57, 108, 145, .07);
      opacity: .88;
    }

    .moon-reflection {
      position: fixed;
      z-index: 0;
      right: clamp(10px, 7.1vw, 118px);
      bottom: 22px;
      width: clamp(80px, 9vw, 125px);
      height: 92px;
      opacity: .16;
      filter: blur(4px);
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(181, 211, 230, .58) 0 2px,
        transparent 2px 8px
      );
      clip-path: polygon(45% 0, 55% 0, 76% 100%, 23% 100%);
      animation: reflection 6s ease-in-out infinite alternate;
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        max(74px, env(safe-area-inset-top))
        18px
        max(126px, calc(env(safe-area-inset-bottom) + 72px));
    }

    .panel {
      width: min(100%, 540px);
      text-align: center;
    }

    .crescent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      margin-bottom: 12px;
      color: #a6becf;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      opacity: .82;
      text-shadow: 0 0 24px rgba(169, 203, 225, .14);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 7vw, 48px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: .09em;
      text-shadow: 0 2px 20px rgba(0,0,0,.22);
    }

    .subtitle {
      max-width: 420px;
      margin: 13px auto 31px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
      letter-spacing: .075em;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link-card {
      position: relative;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 28px;
      align-items: center;
      min-height: 68px;
      padding: 10px 15px 10px 12px;
      color: var(--text);
      text-decoration: none;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow:
        0 16px 44px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter: blur(16px) saturate(112%);
      -webkit-backdrop-filter: blur(16px) saturate(112%);
      transition:
        transform .20s ease,
        border-color .20s ease,
        background .20s ease,
        box-shadow .20s ease;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(110deg, rgba(170,204,226,.035), transparent 32%, transparent 70%, rgba(92,143,178,.025));
      pointer-events: none;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: var(--card-hover);
      box-shadow:
        0 19px 48px rgba(0,0,0,.45),
        0 0 0 1px rgba(138,182,211,.025) inset;
      outline: none;
    }

    .brand {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(181, 211, 230, .035);
      border: 1px solid rgba(174, 205, 225, .12);
      border-radius: 50%;
    }

    .brand svg {
      width: 19px;
      height: 19px;
      display: block;
      fill: currentColor;
    }

    .copy {
      min-width: 0;
      padding: 0 10px;
    }

    .label {
      display: block;
      overflow: hidden;
      color: #eef6fb;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: .035em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail {
      display: block;
      overflow: hidden;
      margin-top: 4px;
      color: var(--muted-2);
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: .045em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      justify-self: end;
      color: #7290a5;
      font-size: 17px;
      line-height: 1;
      transition: transform .20s ease, color .20s ease;
    }

    .link-card:hover .arrow,
    .link-card:focus-visible .arrow {
      transform: translate(2px, -2px);
      color: #c0d6e4;
    }

    .footer {
      margin-top: 28px;
      color: rgba(146, 169, 186, .52);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .footer::before {
      content: "";
      display: block;
      width: 44px;
      height: 1px;
      margin: 0 auto 13px;
      background: linear-gradient(90deg, transparent, rgba(153,190,214,.40), transparent);
    }

    @keyframes stars {
      from { opacity: .64; }
      to { opacity: .88; }
    }

    @keyframes reflection {
      from { transform: translateX(-2px) scaleX(.88); }
      to { transform: translateX(3px) scaleX(1.05); }
    }

    @media (max-width: 600px) {
      .page {
        align-items: flex-start;
        padding-top: max(90px, calc(env(safe-area-inset-top) + 66px));
        padding-bottom: max(112px, calc(env(safe-area-inset-bottom) + 74px));
      }

      .moon {
        top: max(22px, calc(env(safe-area-inset-top) + 14px));
        right: 22px;
        width: 58px;
        opacity: .72;
      }

      .moon-reflection {
        right: 14px;
        opacity: .11;
      }

      .crescent {
        margin-bottom: 8px;
      }

      h1 {
        font-size: 37px;
      }

      .subtitle {
        margin-bottom: 25px;
        padding: 0 16px;
        font-size: 12px;
      }

      .link-card {
        grid-template-columns: 46px minmax(0, 1fr) 25px;
        min-height: 65px;
        border-radius: 16px;
      }
    }

    @media (max-width: 360px) {
      .page {
        padding-left: 13px;
        padding-right: 13px;
      }

      .link-card {
        padding-right: 12px;
      }

      .copy {
        padding-left: 8px;
        padding-right: 6px;
      }
    }

    @media (hover: none) {
      .link-card:active {
        transform: scale(.992);
        border-color: rgba(172, 206, 227, .30);
        background: rgba(10, 31, 52, .88);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
